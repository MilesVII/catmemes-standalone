<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<!-- <meta name="viewport" content="width=device-width; initial-scale=1; maximum-scale=1; user-scalable=0;"/> -->
		<title>Мемы про котов (по искать)</title>
		<link rel="icon" href="/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400..500&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="styles.css"/>
		<script type="module" src="index.js"></script>
	</head>
	<body>
		<template id="t-post">
			<article class="post">
				<div class="post-images"></div>
				<div class="post-caption"></div>
				<div class="post-tags"></div>
				<input type="text" class="post-adder" placeholder="add tag" list="list-tags"></input>
				<a class="post-source"></a>
			</article>
		</template>

		<div class="side">
			<div class="tab-buttons">
				<button class="butt" data-for="rp-tabs-main" data-tab="posts">посты</button>
				<button class="butt" data-for="rp-tabs-main" data-tab="tags">теги</button>
			</div>
			<div class="dashboard side">
				<rampike-tabs id="rp-tabs-dash" tab="vibe">
					<rampike-tab key="vibe">
						<button id="dash-check" class="wide butt">редактировать</button>
						<button id="suggest-toggle" class="wide butt">предложить теги</button>
						<div id="suggest-info" class="dash-note" hidden></div>
					</rampike-tab>
					<rampike-tab key="signin">
						<input type="text" id="dash-login" placeholder="login"></input>
						<input type="password" id="dash-pass" placeholder="password"></input>
						<button id="dash-signin" class="wide butt">sign in</button>
					</rampike-tab>
					<rampike-tab key="admin">
						<div>Change password</div>
						<input type="password" id="dash-change-field" placeholder="new password"></input>
						<button id="dash-change-button" class="wide butt">change password</button>
						<div>Session list</div>
						<div class="dash-session-list"></div>
						<div>Suggestions</div>
						<button id="dash-suggested" class="wide butt">posts with suggestions</button>
						<button id="dash-issue" class="wide butt">issue suggester link</button>
						<input type="text" id="dash-issue-link" readonly hidden></input>
						<div>Stats</div>
						<button id="dash-coverage" class="wide butt">recalculate tag coverage</button>
					</rampike-tab>
				</rampike-tabs>
			</div>
		</div>
		<main class="main">
			<rampike-tabs id="rp-tabs-main" tab="posts">
				<rampike-tab key="posts">
					<div class="search-row">
						<input type="text" id="search-bar" list="list-tags" placeholder="поиск"></input>
						<button class="butt" id="search-button" class="wide">искатб</button>
						<button class="butt" id="search-reset" class="wide">сброс</button>
					</div>
					<rampike-pages id="rp-pages" class="tab-buttons pagination"></rampike-pages>
					<div class="post-list"></div>
					<section class="coverage-wrap" hidden>
						<div class="coverage-head">
							<span>разметка по страницам</span>
							<span class="coverage-summary"></span>
							<span class="coverage-legend">
								0 <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i> все
							</span>
						</div>
						<div class="coverage-scroll">
							<div class="coverage"></div>
						</div>
					</section>
				</rampike-tab>
				<rampike-tab key="tags">
					<div class="tags-list"></div>
				</rampike-tab>
			</rampike-tabs>
		</main>
	</body>
</html>
