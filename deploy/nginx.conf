# /etc/nginx/sites-available/catmemes
# Plain-http server block; run `certbot --nginx -d memes.example.com` afterwards
# to add TLS (the auth cookie is marked Secure, so https is required in production).
server {
	listen 80;
	listen [::]:80;
	server_name memes.example.com;

	# Feeder uploads whole images/videos through /feed/r2/<key>.
	client_max_body_size 64m;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
